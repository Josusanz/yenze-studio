name: Bug report
description: A reproducible problem in the seller or buyer journey
title: "[Bug] "
body:
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
      description: Use sample data. Never include credentials or customer records.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and Yenze version/commit
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized screenshot or error
