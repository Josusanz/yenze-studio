services:
  studio:
    build:
      context: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3061
      YENZE_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3061:3061"
    volumes:
      - studio-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3061/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
volumes:
  studio-data:
